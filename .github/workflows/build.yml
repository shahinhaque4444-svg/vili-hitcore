name: vili-rom-ksu
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r522817/clang-r522817.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h /

      - name: deps
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends \
            bc bison build-essential flex libssl-dev libelf-dev zip unzip lz4 python3 curl
          if ! sudo swapon --show | grep -q .; then
            sudo fallocate -l 8G /swapfile2
            sudo chmod 600 /swapfile2
            sudo mkswap /swapfile2
            sudo swapon /swapfile2
          fi
          free -g; df -h /

      - name: cache clang
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang
          key: clang-r522817-v1

      - name: clang r522817
        run: |
          if [ ! -x "$RUNNER_TEMP/clang/bin/clang" ]; then
            mkdir -p "$RUNNER_TEMP/clang"
            curl -sL "$CLANG_URL" | tar -xz -C "$RUNNER_TEMP/clang"
          fi
          sudo mkdir -p /opt/kernel-tools
          sudo ln -sfn "$RUNNER_TEMP/clang" /opt/kernel-tools/clang-r522817
          /opt/kernel-tools/clang-r522817/bin/clang --version

      - name: toolchain env
        run: echo "/opt/kernel-tools/clang-r522817/bin" >> "$GITHUB_PATH"

      - name: config (device dump + KernelSU)
        run: |
          cp config/vili_rom_defconfig arch/arm64/configs/vili_rom_defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 vili_rom_defconfig
          ./scripts/config --file out/.config \
            -e KSU -e KSU_MANUAL_HOOK \
            -d KSU_TRACEPOINT_HOOK -d KSU_SUSFS -d KSU_KPROBES_HOOK
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          grep -E '^CONFIG_KSU|^CONFIG_LOCALVERSION=|^CONFIG_HZ=|^CONFIG_MODULES=' out/.config

      - name: patch built-in wlan symbol clashes
        run: |
          set -euo pipefail
          grep -rl 'nl80211hdr_put' drivers/staging/ | xargs sed -i 's/nl80211hdr_put/qca_nl80211hdr_put/g'
          grep -rl 'ipa_is_ready' drivers/staging/qcacld-3.0/ | xargs sed -i 's/ipa_is_ready/ipa_is_ready_qca/g'
          grep -rn 'qca_nl80211hdr_put' drivers/staging/ | head -5

      - name: build
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image dtbs
          ls -lh out/arch/arm64/boot/Image

      - name: package
        run: |
          set -euo pipefail
          AK=out/ak3
          rm -rf "$AK"
          cp -a anykernel "$AK"
          cp out/arch/arm64/boot/Image "$AK/Image"
          DTB=$(find out/arch/arm64/boot/dts/vendor/qcom -name 'lahaina-v2.1.dtb' | head -1)
          DTO=$(find out/arch/arm64/boot/dts/vendor/qcom -name 'vili*overlay.dtbo' | head -1)
          test -n "$DTB" && test -n "$DTO"
          cp "$DTB" "$AK/dtb"
          cp "$DTO" "$AK/dtbo.img"
          sed -i 's/^do.modules=1/do.modules=0/' "$AK/anykernel.sh"
          sed -i 's/^kernel.string=.*/kernel.string=5.4.302-qgki + KernelSU (vili)/' "$AK/anykernel.sh"
          (cd "$AK" && zip -r9q ../vili-ksu-gha-${{ github.run_number }}.zip .)
          ls -lh out/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vili-ksu-${{ github.run_number }}
          path: out/vili-ksu-gha-*.zip
          retention-days: 30

      - name: release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ksu-${{ github.run_number }}
          files: out/vili-ksu-gha-*.zip
